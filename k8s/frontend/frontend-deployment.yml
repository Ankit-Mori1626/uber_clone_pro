kind: Deployment
apiVersion: apps/v1
metadata:
  name: uber-frontend
spec:
  selector:
    matchLabels:
      app: uber-frontend
  template:
    metadata:
      labels:
        app: uber-frontend
    spec:
      containers:
      - name: frontend
        image: ankitmori1626/uber-frontend:latest
        ports:
        - containerPort: 80
---
kind: Service
apiVersion: v1
metadata:
  name: frontend-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector: 
    app: uber-frontend  
